name: w4_bc_qwen_v2
arch: qwen
model_path: /path/to/models/Qwen3.5-0.8B
K: 128
max_fruits: 80
boundary: true
obs_format: tokens
T: 160
n_text: 96
max_len: 896
lora_r: 64
lora_alpha: 128
head_dim: 512
# --- RL recipe kept identical to w4_qwen_text so the BC ckpt warm-starts it ---
n_step: 3
gamma: 1.0
double: true
mirror_aug: true
reward_scale: 1.0
tempo: false
n_quant: 1
# --- BC losses: soft-target pi KD + 128-vector Q distill + 0.5*TD ---
bc_lambda_pi: 1.0
bc_lambda_qd: 1.0
bc_lambda_td: 0.5
# v2 delta: pi head trains on softmax((q_T - mean_a q_T)/tau) instead of hard
# argmax CE. Teacher top1-top2 margin: med 1.0 / p90 7.0 Q units on Q~1096
# (f16 ULP = 1.0 at that scale) -> hard labels are unattainable: run1/2/3
# saturated at l_pi 3.73-3.80 == action-marginal entropy 3.787, agree_pi
# 0.092-0.098 == best-constant 0.075. tau=1.0 gives target H=1.59 nats
# (top5 mass 0.80); tau=2 -> 2.34 nats; tau>=8 is indistinguishable from the
# marginal (3.83) and carries no policy signal.
bc_pi_tau: 1.0
# v2.1 delta (step600+): soft RANKING distill on the Q vector itself —
# CE(softmax((q_T-mean)/tau), log_softmax(z/tau)). Measured at step 600:
# val_qd 53 but q_regret 28.8 ~= the constant-policy baseline 30.4 and eval
# 523.9 ~= random play (500-650), i.e. the smooth_l1 gradient (qd) was ~80%
# level error (state-scalar; per-state contrast is only 12) and action ranking
# got no dedicated gradient. softmax is level-invariant, so this term
# supervises contrast only; qd/td keep the scale anchored for the RL warm start.
bc_qrank_tau: 1.0
bc_lambda_qrank: 1.0
# --- learner (torchrun 8 ranks; batch is global, each rank gets batch/world) ---
batch: 1024
# micro 8: activations measured ~2.55MB/(sample*token) and HF gradient
# checkpointing does NOT reduce them for this hybrid GDN arch; micro8 ->
# 24.5G worst-case (896 bucket), ~14G typical.
micro_bs: 8
lr: 3.0e-4
lora_lr: 1.0e-4
lr_warmup: 200
lr_floor_frac: 0.1
weight_decay: 1.0e-5
ema_tau: 0.003
# 12000 * 1024 = 12.3M samples vs 14.4M transitions in the 24-actor subset
grad_budget: 12000
ckpt_keep: 4
seed: 0
# --- actors / placement: unused by bc_learner_qwen, kept for the RL arm ---
eps_min: 0.02
eps_max: 0.5
actor_shard: 4096
infer: server
learner_gpus: [0, 1, 2, 3, 4, 5, 6, 7]
infer_gpus: [0]
evaluator_gpu: 0
